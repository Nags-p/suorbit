name: SuOrbit Automated News Update

on:
  schedule:
    # Run at the start of every hour
    - cron: '0 * * * *'
  push:
    branches: [ main ]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest news
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/fetch-news.js

      - name: Commit and push updated data files
        run: |
          git config --global user.name "suorbit-bot[bot]"
          git config --global user.email "suorbit-bot[bot]@users.noreply.github.com"
          git add data/*.json
          # Check if there are changes before committing to avoid workflow failures
          if ! git diff --cached --exit-code; then
            git commit -m "chore: automated hourly news update [skip ci]"
            git push
          else
            echo "No news changes detected."
          fi
