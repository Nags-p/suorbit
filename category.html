<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Category News - SuOrbit</title>
  <meta name="description" content="Browse simplified, curated news in Technology, Space, AI, Science, Startups, and Business on SuOrbit.">
  <link rel="canonical" href="https://suorbit.top/category.html">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>

  <!-- Sticky Header & Navigation Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Breaking News Ticker -->
  <section class="ticker-wrapper" aria-label="Breaking News">
    <div class="container ticker-container">
      <span class="ticker-label">Breaking</span>
      <div class="ticker-scroll" id="ticker-headlines">
        Loading breaking news feed...
      </div>
    </div>
  </section>

  <!-- Main Category Feed -->
  <main class="container" style="padding: 3rem 1.5rem;">
    <!-- Category Header Info -->
    <div style="margin-bottom: 3rem; border-bottom: 1px solid var(--border); padding-bottom: 2rem;">
      <span class="eyebrow">Category Feed</span>
      <h1 id="category-page-title" style="font-size: 3rem; margin-bottom: 0.5rem; font-weight: 900;">Loading...</h1>
      <p id="category-page-tagline" style="font-size: 1.15rem; color: var(--text-secondary); max-width: 700px;">Loading category description...</p>
    </div>

    <!-- Category News Card Grid -->
    <div class="news-grid" id="category-news-grid">
      <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 0;">
        <p style="color: var(--text-secondary);">Querying articles database...</p>
      </div>
    </div>

    <!-- Pagination buttons -->
    <div class="pagination-container" id="category-pagination" style="display: none;"></div>
  </main>

  <!-- Newsletter Section -->
  <section class="newsletter-section" aria-label="Newsletter Subscription">
    <div class="container">
      <div class="newsletter-card">
        <h2 class="newsletter-title">Subscribe to SuOrbit Weekly</h2>
        <p class="newsletter-desc">Join 50,000+ tech leaders, software developers, and space enthusiasts receiving our simplified summary news digest.</p>
        <form class="newsletter-form">
          <input type="email" class="newsletter-input" placeholder="Enter your email address" required aria-label="Email address field">
          <button type="submit" class="newsletter-btn">Join Newsletter</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/category.js"></script>
</body>
</html>
