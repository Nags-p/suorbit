<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search News - SuOrbit</title>
  <meta name="description" content="Search simplified news on tech, AI, space, science, startups, and business on SuOrbit.">
  <link rel="canonical" href="https://suorbit.top/search.html">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
</head>
<body>

  <!-- Sticky Header & Navigation Placeholder -->
  <div id="header-placeholder"></div>

  <!-- Breaking News Ticker -->
  <section class="ticker-wrapper" aria-label="Breaking News">
    <div class="container ticker-container">
      <span class="ticker-label">Breaking</span>
      <div class="ticker-scroll" id="ticker-headlines">
        Loading breaking news feed...
      </div>
    </div>
  </section>

  <!-- Search Panel Header -->
  <section class="search-header-panel" aria-label="Search Settings">
    <div class="container">
      <div class="search-page-box">
        <span class="eyebrow" style="margin-bottom: 0.25rem;">Search Portal</span>
        <h1 class="search-title-heading">Explore SuOrbit News</h1>
        
        <!-- Input Search Bar -->
        <form id="search-page-form" style="width: 100%;">
          <div class="search-input-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" class="search-input-field" id="search-page-input" placeholder="Type keywords, authors, titles, or categories..." required style="background-color: var(--bg-secondary); padding-top: 0.85rem; padding-bottom: 0.85rem;" aria-label="Search keywords">
          </div>
        </form>

        <!-- Filters Row -->
        <div class="search-filter-row">
          <!-- Category Filter -->
          <div class="filter-select-wrapper">
            <select class="filter-select" id="filter-category" aria-label="Filter by Category">
              <option value="">All Categories</option>
              <option value="technology">Technology</option>
              <option value="ai">Artificial Intelligence</option>
              <option value="space">Space Exploration</option>
              <option value="science">Science</option>
              <option value="startups">Startups</option>
              <option value="business">Business</option>
            </select>
          </div>
          <!-- Sorting Filter -->
          <div class="filter-select-wrapper">
            <select class="filter-select" id="filter-sort" aria-label="Sort by Date">
              <option value="newest">Sort by Newest</option>
              <option value="oldest">Sort by Oldest</option>
              <option value="alphabetical">Sort Alphabetically</option>
            </select>
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Main Search Results Grid Container -->
  <main class="container" style="padding-bottom: 4rem;">
    <!-- Result count -->
    <div class="search-results-info" id="results-count-text">
      Enter keywords to search articles...
    </div>

    <!-- Search cards grid -->
    <div class="news-grid" id="search-results-grid">
      <!-- Renders search cards dynamically -->
    </div>

    <!-- Pagination buttons -->
    <div class="pagination-container" id="search-pagination" style="display: none;"></div>
  </main>

  <!-- Newsletter signup section -->
  <section class="newsletter-section" aria-label="Newsletter Subscription">
    <div class="container">
      <div class="newsletter-card">
        <h2 class="newsletter-title">Subscribe to SuOrbit Weekly</h2>
        <p class="newsletter-desc">Join 50,000+ tech leaders, software developers, and space enthusiasts receiving our simplified summary news digest.</p>
        <form class="newsletter-form">
          <input type="email" class="newsletter-input" placeholder="Enter your email address" required aria-label="Email address field">
          <button type="submit" class="newsletter-btn">Join Newsletter</button>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer Placeholder -->
  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script src="assets/js/search.js"></script>
</body>
</html>
